name: Sync upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream
        run: git remote add upstream https://github.com/oven-sh/bun.git || true
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream
        run: git merge upstream/HEAD --no-edit || git merge FETCH_HEAD --no-edit
      - name: Preserve fork workflow files
        run: |
          git checkout HEAD^1 -- .github/workflows
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
      - name: Push
        run: git push